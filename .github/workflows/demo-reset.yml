name: Reset da demonstração (Supabase)

# Carrega os 3 anos de dados simulados no banco publicado. Roda só quando alguém clica em "Run workflow".
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite RESET para apagar e recriar todos os dados da demonstração'
        required: true

jobs:
  reset:
    if: ${{ github.event.inputs.confirmar == 'RESET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      SIM_SEED: "20261125"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testar a conexão
        run: npm run db:ping
      - name: Criar as tabelas
        run: npm run db:migrate
      - name: Gerar os dados da demonstração
        timeout-minutes: 15
        run: npm run demo:reset
      - name: Avanço diário (gera os dias que faltarem até ontem)
        run: npm run demo:advance-day
